name: Update Fuel Prices

on:
  schedule:
    - cron: '0 6 * * *' # Exécution tous les jours à 6h du matin
  workflow_dispatch: # Permet de le lancer manuellement depuis GitHub

jobs:
  update-fuel:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        # Si tu préfères npm ci, utilise plutôt : npm ci --legacy-peer-deps

      - name: Run fuel scraper / update script
        run: npm run update-fuel
        # Remplace par la commande exacte qui met à jour tes prix de carburant dans ton projet

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic fuel price update"
          branch: main
